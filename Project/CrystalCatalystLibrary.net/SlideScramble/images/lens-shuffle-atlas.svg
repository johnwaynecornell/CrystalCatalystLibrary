<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc">
<title id="title">Portable Lens Shuffle Atlas: eight entry configurations</title>
<desc id="desc">Eight shuffles arranged in a two-column, four-row grid, with blank cells facing inward in each half and inverse pairs vertically aligned. Each entry shows four shape-directed moves and the resulting two by two diagram. A blank square represents the cell's original value, not an empty tile.</desc>
