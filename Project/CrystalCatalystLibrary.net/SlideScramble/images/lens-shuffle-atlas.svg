<text x="40" y="57" font-family="sans-serif" font-size="33" font-weight="700" fill="#0f172a">Portable Lens — Shuffle Atlas</text>
<text x="40" y="91" font-family="sans-serif" font-size="18" fill="#475569">Blank square = original cell value; never an empty tile. Read each formula left to right.</text>
